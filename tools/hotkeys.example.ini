# 截屏服务配置
# 语法: 修饰键+修饰键+按键  例如 Ctrl+Alt+F1 / Ctrl+Shift+S / Alt+PrintScreen
# 修饰键: Ctrl Alt Shift Win    按键: A-Z 0-9 F1-F24 PrintScreen Home End Insert Space
# 改完保存，然后在托盘菜单里选“重新加载热键配置”，或重启截屏服务。
# 若某个组合已被别的程序占用，服务会自动换用其它空闲组合，实际生效的键见 shots\daemon.txt。

Full=Ctrl+Alt+F1
Window=Ctrl+Alt+F2
Region=Ctrl+Alt+F3

# 本机 HTTP 接口端口，供 DSH Web 界面的截屏按钮调用（仅监听 127.0.0.1）
Port=38901

# 截图前是否先隐藏前台窗口（QQ 那种“让开再截”的效果）
#   foreground      隐藏当前前台窗口（默认）
#   none            不隐藏
#   title:关键字    只隐藏标题含该关键字的窗口
HideBeforeCapture=foreground

# 框选和选窗口时高亮框线的粗细（像素，1-20）
OutlineWidth=2

# 框线颜色：#RRGGBB / #RGB / 颜色名（red blue green yellow orange magenta cyan pink white…）
# 注意：框线的深浅取决于它画在哪一层，若想更醒目主要靠 OutlineWidth
RegionColor=#ff4040
WindowColor=#ff4040